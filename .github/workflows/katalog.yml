# Prüft bei jedem Push alle Pakete gegen das Schema und erzeugt katalog.json neu.
# Ohne API-Schlüssel: nur das eingebaute GITHUB_TOKEN. Der Ordner fragen/ wird ignoriert.
name: Pakete prüfen und Katalog erzeugen

on:
  push:
    paths-ignore:
      - "fragen/**"
      - "katalog.json"
  pull_request:
    paths-ignore:
      - "fragen/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: katalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  katalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - name: Pakete prüfen
        run: python3 werkzeuge/katalog.py --pruefen
      - name: katalog.json erzeugen und committen
        if: github.event_name != 'pull_request'
        run: |
          python3 werkzeuge/katalog.py
          if ! git diff --quiet -- katalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add katalog.json
            git commit -m "katalog.json aktualisiert"
            git push
          fi
